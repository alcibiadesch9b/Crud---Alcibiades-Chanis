<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Autor: Alcibiades Chanis | CRUD con Fetch + PHP OOP + MySQL -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Productos | Alcibiades Chanis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #eef2ff, #f8fafc); min-height: 100vh; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 10px 30px -12px rgba(30, 41, 59, .25); }
        .card-header { border-radius: 1rem 1rem 0 0 !important; }
        thead th { white-space: nowrap; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand"><i class="bi bi-box-seam"></i> CRUD Productos – Fetch + PHP + MySQL</span>
        <span class="text-white-50 small">Alcibiades Chanis · 1S3122</span>
    </div>
</nav>

<div class="container pb-5">
    <!-- Alert de Bootstrap (mensajes del servidor) -->
    <div id="alerta" class="alert d-none" role="alert"></div>

    <div class="row g-4">
        <!-- ===== Formulario ===== -->
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" id="tituloForm"><i class="bi bi-plus-circle"></i> Registrar producto</h5>
                </div>
                <div class="card-body">
                    <form id="formProducto" novalidate>
                        <input type="hidden" id="id" name="id">
                        <input type="hidden" id="Accion" name="Accion" value="Guardar">

                        <div class="mb-3">
                            <label for="codigo" class="form-label">Código</label>
                            <input type="text" class="form-control" id="codigo" name="codigo" maxlength="20" required placeholder="Ej: P004">
                            <div class="invalid-feedback" data-error="codigo"></div>
                        </div>
                        <div class="mb-3">
                            <label for="producto" class="form-label">Producto</label>
                            <input type="text" class="form-control" id="producto" name="producto" maxlength="100" required placeholder="Nombre del producto">
                            <div class="invalid-feedback" data-error="producto"></div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="precio" class="form-label">Precio ($)</label>
                                <input type="number" class="form-control" id="precio" name="precio" step="0.01" min="0.01" required>
                                <div class="invalid-feedback" data-error="precio"></div>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="cantidad" class="form-label">Cantidad</label>
                                <input type="number" class="form-control" id="cantidad" name="cantidad" step="1" min="1" required>
                                <div class="invalid-feedback" data-error="cantidad"></div>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-primary" id="btnRegistrar" data-accion="Guardar">
                                <i class="bi bi-save"></i> <span>Registrar</span>
                            </button>
                            <button type="button" class="btn btn-outline-secondary" id="btnCancelar" data-accion="Cancelar">
                                <i class="bi bi-x-circle"></i> Limpiar / Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- ===== Búsqueda y tabla ===== -->
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-white">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="txtBuscar" class="form-control" placeholder="Buscar por código o nombre...">
                        <button class="btn btn-success" id="btnBuscar" data-accion="Buscar">Buscar</button>
                        <button class="btn btn-outline-secondary" id="btnListar" data-accion="Listar">Ver todos</button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th><th>Código</th><th>Producto</th>
                                    <th class="text-end">Precio</th><th class="text-center">Cantidad</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductos">
                                <tr><td colspan="6" class="text-center text-muted py-4">Cargando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>
</body>
</html>
